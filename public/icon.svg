<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D3B"/>
      <stop offset="100%" stop-color="#E05316"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA066"/>
      <stop offset="100%" stop-color="#F06A2A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F06A2A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo Dark Charcoal arredondado -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2A2A2A" stroke-width="2"/>

  <!-- Halo de iluminação sutil -->
  <circle cx="256" cy="240" r="170" fill="#F06A2A" opacity="0.08"/>

  <!-- Monograma estilizado "B" com haltere integrado -->
  <g filter="url(#glow)">
    <!-- Barra vertical do B -->
    <rect x="146" y="116" width="46" height="280" rx="14" fill="url(#brandGrad)"/>

    <!-- Lóbulo superior do B -->
    <path d="M 176 116 
             H 276 
             C 328 116, 362 144, 362 192 
             C 362 238, 326 262, 276 262 
             H 176 Z" 
          fill="url(#brandGrad)"/>
    <path d="M 192 152 
             H 268 
             C 298 152, 318 168, 318 192 
             C 318 216, 298 226, 268 226 
             H 192 Z" 
          fill="#121212"/>

    <!-- Lóbulo inferior do B -->
    <path d="M 176 250 
             H 290 
             C 346 250, 384 280, 384 334 
             C 384 388, 344 396, 286 396 
             H 176 Z" 
          fill="url(#brandGrad)"/>
    <path d="M 192 286 
             H 280 
             C 314 286, 338 304, 338 334 
             C 338 362, 314 362, 280 362 
             H 192 Z" 
          fill="#121212"/>

    <!-- Mini haltere decorativo no centro da junção -->
    <g transform="translate(376, 256) scale(0.9)">
      <circle cx="-16" cy="0" r="10" fill="url(#accentGrad)"/>
      <rect x="-18" y="-14" width="4" height="28" rx="2" fill="url(#accentGrad)"/>
      <rect x="-14" y="-3" width="28" height="6" rx="2" fill="#FFFFFF"/>
      <circle cx="16" cy="0" r="10" fill="url(#accentGrad)"/>
      <rect x="14" y="-14" width="4" height="28" rx="2" fill="url(#accentGrad)"/>
    </g>
  </g>

  <!-- Assinatura "STUDIO" no rodapé -->
  <text x="256" y="442" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="9" 
        fill="#8A8F98">STUDIO</text>
  <text x="256" y="470" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="19" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#F06A2A">BRU OLIVEIRA</text>
</svg>
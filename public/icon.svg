<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente oficial roxo vibrante Studio Bru -->
    <linearGradient id="purpleBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="purpleAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo escuro com cantos arredondados para apps modernos -->
  <rect width="512" height="512" rx="112" fill="#0F0E17" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2E284A" stroke-width="2" />

  <!-- Monograma estilizado 'B' em curvas fluidas elegantes -->
  <g filter="url(#purpleGlow)" transform="translate(8, -12)">
    <!-- Haste esquerda e laço inferior orgânico -->
    <path d="M 170 330 
             C 145 285, 155 210, 190 170 
             C 215 140, 248 130, 260 135 
             C 250 160, 230 200, 205 245 
             C 185 280, 172 315, 170 330 Z" 
          fill="url(#purpleAccentGrad)" />

    <!-- Traço principal fluido dos laços caligráficos do B -->
    <path d="M 180 165
             C 210 130, 260 120, 285 140
             C 310 160, 310 195, 280 220
             C 260 236, 235 240, 218 242
             C 255 244, 298 255, 308 288
             C 320 325, 285 355, 240 355
             C 195 355, 170 325, 175 305
             C 180 290, 195 292, 192 305
             C 190 325, 215 338, 242 338
             C 275 338, 290 315, 282 290
             C 272 262, 230 258, 195 258
             C 215 220, 242 178, 265 152
             C 275 140, 255 135, 240 145
             C 210 165, 188 200, 172 235
             C 165 210, 170 185, 180 165 Z"
          fill="url(#purpleBrandGrad)" />

    <!-- Folha fluida inferior (ponta inferior do monograma) -->
    <path d="M 170 330
             C 165 350, 180 375, 200 375
             C 180 365, 172 345, 170 330 Z"
          fill="url(#purpleAccentGrad)" />
  </g>

  <!-- Tipografia Studio Bru Oliveira -->
  <text x="256" y="420"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Inter', sans-serif"
        font-size="22"
        font-weight="800"
        letter-spacing="9"
        fill="#DDD6FE">STUDIO</text>
  <text x="256" y="452"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28"
        font-weight="700"
        letter-spacing="1"
        fill="#FFFFFF">Bru Oliveira</text>
  <text x="256" y="478"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Inter', sans-serif"
        font-size="12"
        font-weight="600"
        letter-spacing="3"
        fill="#A78BFA">PERSONAL &amp; PILATES</text>
</svg>

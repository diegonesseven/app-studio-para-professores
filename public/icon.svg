<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente oficial da marca: Azul-Índigo para Verde-Menta/Teal -->
    <linearGradient id="brandGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B4FA0" />
      <stop offset="55%" stop-color="#5575B5" />
      <stop offset="100%" stop-color="#7EC8B6" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C60B4" />
      <stop offset="100%" stop-color="#3F4390" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93D8C8" />
      <stop offset="100%" stop-color="#6DBCA9" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#4B4FA0" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Fundo Limpo e Elegante com cantos arredondados -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#E6EAF0" stroke-width="2" />

  <!-- Monograma estilizado B em folha / laço com curvatura fluida orgânica -->
  <g filter="url(#softShadow)" transform="translate(4, -10)">
    <!-- Haste esquerda e laço inferior em folha menta/teal -->
    <path d="M 170 330 
             C 145 285, 155 210, 190 170 
             C 215 140, 248 130, 260 135 
             C 250 160, 230 200, 205 245 
             C 185 280, 172 315, 170 330 Z" 
          fill="url(#tealGrad)" />

    <!-- Traço principal caligráfico / laços do B em azul-índigo gradiente -->
    <path d="M 180 165
             C 210 130, 260 120, 285 140
             C 310 160, 310 195, 280 220
             C 260 236, 235 240, 218 242
             C 255 244, 298 255, 308 288
             C 320 325, 285 355, 240 355
             C 195 355, 170 325, 175 305
             C 180 290, 195 292, 192 305
             C 190 325, 215 338, 242 338
             C 275 338, 290 315, 282 290
             C 272 262, 230 258, 195 258
             C 215 220, 242 178, 265 152
             C 275 140, 255 135, 240 145
             C 210 165, 188 200, 172 235
             C 165 210, 170 185, 180 165 Z"
          fill="url(#brandGradient)" />

    <!-- Folha fluida inferior (acabamento da ponta do monograma) -->
    <path d="M 170 330
             C 165 350, 180 375, 200 375
             C 180 365, 172 345, 170 330 Z"
          fill="url(#tealGrad)" />
  </g>

  <!-- Tipografia Oficial STUDIO BRU OLIVEIRA -->
  <text x="256" y="420"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Inter', sans-serif"
        font-size="22"
        font-weight="800"
        letter-spacing="9"
        fill="#4B4FA0">STUDIO</text>
  <text x="256" y="450"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="27"
        font-weight="700"
        letter-spacing="1"
        fill="#373B7E">Bru Oliveira</text>
  <text x="256" y="475"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Inter', sans-serif"
        font-size="12"
        font-weight="600"
        letter-spacing="3"
        fill="#7EC8B6">PERSONAL &amp; PILATES</text>
</svg>
